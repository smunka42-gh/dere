# Refreshes the saved scan once per trading day, one hour after the US
# market close, and commits the result back to the repo.
#
# The deployed site reads output/latest_scan_<market>.json straight from
# the repo, so committing a new scan is what makes the live site update —
# Streamlit Community Cloud redeploys automatically on push.
#
# Runs on GitHub's infrastructure, not a laptop, so it does not depend on
# any machine being awake. Scans EVERY configured market (see markets.py)
# on every run, not just whichever one the last viewer had selected —
# each market gets its own output file and its own validation.

name: Daily scan

# DISABLED — the app this fed has been retired. The schedule is commented
# out rather than deleted so the gating logic (which took real work to get
# right) is preserved for the successor project.
on:
  # schedule:
    # GitHub cron is UTC ONLY and does not follow daylight saving, so a
    # single expression cannot stay at 17:00 New York year-round. Both
    # times below fire; the gate below decides which one actually scans.
  #   - cron: "0 21 * * 1-5"   # 17:00 America/New_York while EDT
  #   - cron: "0 22 * * 1-5"   # 17:00 America/New_York while EST
  workflow_dispatch:          # allows a manual run from the Actions tab

permissions:
  contents: write             # needed to push the refreshed scan back

concurrency:
  # If a run is somehow still going when the next fires, don't stack them.
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45       # a full 500-ticker S&P 500 scan is the long pole; Nifty 50 adds a minute or so on top

    steps:
      # Checkout runs FIRST, unconditionally, because the gate below has
      # to read the currently-committed scan to decide anything.
      - uses: actions/checkout@v4

      - name: Decide whether this run should scan
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # python3 (not python) — this deliberately runs BEFORE
          # setup-python, so only the runner image's system interpreter
          # is available. Diagnostics go to stderr so they show up in the
          # log; only the key=value line reaches $GITHUB_OUTPUT, which
          # rejects anything else.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, sys
          from datetime import datetime, timezone, timedelta

          def log(msg):
              print(msg, file=sys.stderr)

          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              # A human asked for it explicitly — always honour that,
              # including a same-day re-run to pick up corrected data.
              log("Manual run — proceeding.")
              print("proceed=true")
              raise SystemExit(0)

          # WHY THIS IS NOT AN "IS IT 17:00 IN NEW YORK?" CHECK
          #
          # It used to be, and that silently broke the whole schedule.
          # GitHub does not guarantee scheduled runs fire on time — under
          # load they are delayed by hours or dropped outright. Observed
          # here: runs scheduled for 21:00 UTC actually executed at ~05:00
          # UTC, by which point New York read 01:00, so the hour check
          # rejected them and the job exited in 7 seconds having done
          # nothing. It reported SUCCESS every time, so the site just went
          # quietly stale while the Actions tab looked healthy.
          #
          # Gating on STATE instead of on the clock removes that whole
          # class of failure: ask "is the committed scan still missing
          # today's close?", which is true regardless of when the runner
          # happens to wake up.
          NY = timezone(timedelta(hours=-4))  # see note below on DST
          # America/New_York is not available as a stdlib name on every
          # runner image without tzdata, and the exact offset does not
          # matter here: this is only used to derive a DATE and to ask
          # whether the US close (16:00 local) has passed. An hour of
          # drift either way cannot change either answer except within a
          # single hour around midnight, where a missed day is picked up
          # by the >=2-day catch-up rule below anyway.
          now = datetime.now(timezone.utc).astimezone(NY)

          scan_path = pathlib.Path("output/latest_scan_sp500.json")
          scan = json.loads(scan_path.read_text())
          scanned_at = datetime.fromisoformat(scan["scan_timestamp_utc"]).astimezone(NY)

          days_behind = (now.date() - scanned_at.date()).days
          log(f"committed scan: {scanned_at.date()}  now: {now.date()} "
              f"({now:%H:%M} local)  days behind: {days_behind}")

          if days_behind <= 0:
              # Already has today's data. This is what stops the second
              # DST cron from re-scanning an hour after the first.
              proceed, why = False, "already scanned today"
          elif days_behind == 1 and now.hour < 16:
              # One day behind, but today's close hasn't happened yet —
              # there is genuinely nothing newer to fetch. Catches a run
              # delayed into the small hours of the next morning.
              proceed, why = False, "today's close has not happened yet"
          else:
              # Either it is after today's close, or we are two or more
              # days behind (a missed day, a long outage) — in which case
              # scan regardless of the hour to catch back up.
              proceed, why = True, "scan is behind and the latest close is available"

          log(f"decision: {'PROCEED' if proceed else 'SKIP'} — {why}")
          print(f"proceed={'true' if proceed else 'false'}")
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: Run the scan (every configured market)
        if: steps.gate.outputs.proceed == 'true'
        run: python run_daily_scan.py

      - name: Validate before committing
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import json, sys, pathlib

          # A partial or failed scan must NOT reach the live site. Yahoo's
          # unofficial API can rate-limit or return empty frames, which
          # would otherwise commit a near-empty file and blank the page.
          # Each market's index size is very different (S&P 500 vs. a
          # 30/50-name index), so each gets its own minimum bar rather
          # than one shared threshold.
          MARKET_MINIMUMS = {
              "output/latest_scan_sp500.json": 400,
              "output/latest_scan_nifty50.json": 40,
          }

          any_failure = False
          for file_path, minimum in MARKET_MINIMUMS.items():
              path = pathlib.Path(file_path)
              if not path.exists():
                  print(f"FAIL: {file_path} missing — refusing to publish.")
                  any_failure = True
                  continue

              scan = json.loads(path.read_text())
              results = scan.get("all_results", [])
              errors = scan.get("tickers_with_errors", 0)
              scanned = scan.get("tickers_scanned", 0)

              print(f"{file_path}: scanned={scanned} results={len(results)} errors={errors}")

              if len(results) < minimum:
                  print(f"FAIL: {file_path} only has {len(results)} results (need >= {minimum}).")
                  any_failure = True
                  continue
              if errors > minimum:
                  print(f"FAIL: {file_path} had {errors} tickers error out.")
                  any_failure = True
                  continue

              # Spot-check that prices actually came through, not just rows.
              priced = sum(1 for r in results if r.get("most_recent_close"))
              if priced < len(results) * 0.9:
                  print(f"FAIL: {file_path} only has {priced}/{len(results)} rows with a price.")
                  any_failure = True
                  continue

              print(f"{file_path}: looks healthy.")

          if any_failure:
              sys.exit("One or more markets failed validation — refusing to publish any of them.")
          PY

      - name: Commit and push if the data actually changed
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SCAN_FILES="output/latest_scan_sp500.json output/latest_scan_nifty50.json"

          # The scan timestamp changes on every run, so comparing whole
          # files would commit daily even on market holidays when nothing
          # moved. Compare the RESULTS instead, per market — Indian and
          # US market holidays don't line up, so one market's data can be
          # genuinely unchanged while another's has moved.
          CHANGED_FILES=""
          for f in $SCAN_FILES; do
            if git diff --quiet -- "$f"; then
              continue
            fi
            CHANGED=$(python - "$f" <<'PY'
          import json, subprocess, sys
          file_path = sys.argv[1]
          new = json.loads(open(file_path).read())
          old_raw = subprocess.run(
              ["git", "show", f"HEAD:{file_path}"],
              capture_output=True, text=True).stdout
          old = json.loads(old_raw) if old_raw else {}
          print("yes" if new.get("all_results") != old.get("all_results") else "no")
          PY
            )
            if [ "$CHANGED" = "yes" ]; then
              CHANGED_FILES="$CHANGED_FILES $f"
            else
              git checkout -- "$f"
            fi
          done

          if [ -z "$CHANGED_FILES" ]; then
            echo "No market's data actually changed (holidays, or only timestamps moved) — nothing to commit."
            exit 0
          fi

          git add $CHANGED_FILES
          git commit -m "Refresh scan data ($(TZ=America/New_York date '+%Y-%m-%d'))"
          git push
