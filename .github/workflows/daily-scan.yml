# Refreshes the saved scan once per trading day, one hour after the US
# market close, and commits the result back to the repo.
#
# The deployed site reads output/latest_scan_<market>.json straight from
# the repo, so committing a new scan is what makes the live site update —
# Streamlit Community Cloud redeploys automatically on push.
#
# Runs on GitHub's infrastructure, not a laptop, so it does not depend on
# any machine being awake. Scans EVERY configured market (see markets.py)
# on every run, not just whichever one the last viewer had selected —
# each market gets its own output file and its own validation.

name: Daily scan

on:
  schedule:
    # GitHub cron is UTC ONLY and does not follow daylight saving, so a
    # single expression cannot stay at 17:00 New York year-round.
    # Both times below are scheduled and the job gates on the real local
    # hour, so exactly one of them proceeds on any given day.
    - cron: "0 21 * * 1-5"   # 17:00 America/New_York while EDT
    - cron: "0 22 * * 1-5"   # 17:00 America/New_York while EST
  workflow_dispatch:          # allows a manual run from the Actions tab

permissions:
  contents: write             # needed to push the refreshed scan back

concurrency:
  # If a run is somehow still going when the next fires, don't stack them.
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45       # a full 500-ticker S&P 500 scan is the long pole; Nifty 50 adds a minute or so on top

    steps:
      - name: Decide whether this is the 17:00 Eastern run
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=America/New_York date +%H)
          if [ "$HOUR" = "17" ]; then
            echo "Eastern time is ${HOUR}:00 — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Eastern time is ${HOUR}:00, not 17:00 — this is the"
            echo "other DST schedule firing. Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: Run the scan (every configured market)
        if: steps.gate.outputs.proceed == 'true'
        run: python run_daily_scan.py

      - name: Validate before committing
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import json, sys, pathlib

          # A partial or failed scan must NOT reach the live site. Yahoo's
          # unofficial API can rate-limit or return empty frames, which
          # would otherwise commit a near-empty file and blank the page.
          # Each market's index size is very different (S&P 500 vs. a
          # 30/50-name index), so each gets its own minimum bar rather
          # than one shared threshold.
          MARKET_MINIMUMS = {
              "output/latest_scan_sp500.json": 400,
              "output/latest_scan_nifty50.json": 40,
          }

          any_failure = False
          for file_path, minimum in MARKET_MINIMUMS.items():
              path = pathlib.Path(file_path)
              if not path.exists():
                  print(f"FAIL: {file_path} missing — refusing to publish.")
                  any_failure = True
                  continue

              scan = json.loads(path.read_text())
              results = scan.get("all_results", [])
              errors = scan.get("tickers_with_errors", 0)
              scanned = scan.get("tickers_scanned", 0)

              print(f"{file_path}: scanned={scanned} results={len(results)} errors={errors}")

              if len(results) < minimum:
                  print(f"FAIL: {file_path} only has {len(results)} results (need >= {minimum}).")
                  any_failure = True
                  continue
              if errors > minimum:
                  print(f"FAIL: {file_path} had {errors} tickers error out.")
                  any_failure = True
                  continue

              # Spot-check that prices actually came through, not just rows.
              priced = sum(1 for r in results if r.get("most_recent_close"))
              if priced < len(results) * 0.9:
                  print(f"FAIL: {file_path} only has {priced}/{len(results)} rows with a price.")
                  any_failure = True
                  continue

              print(f"{file_path}: looks healthy.")

          if any_failure:
              sys.exit("One or more markets failed validation — refusing to publish any of them.")
          PY

      - name: Commit and push if the data actually changed
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SCAN_FILES="output/latest_scan_sp500.json output/latest_scan_nifty50.json"

          # The scan timestamp changes on every run, so comparing whole
          # files would commit daily even on market holidays when nothing
          # moved. Compare the RESULTS instead, per market — Indian and
          # US market holidays don't line up, so one market's data can be
          # genuinely unchanged while another's has moved.
          CHANGED_FILES=""
          for f in $SCAN_FILES; do
            if git diff --quiet -- "$f"; then
              continue
            fi
            CHANGED=$(python - "$f" <<'PY'
          import json, subprocess, sys
          file_path = sys.argv[1]
          new = json.loads(open(file_path).read())
          old_raw = subprocess.run(
              ["git", "show", f"HEAD:{file_path}"],
              capture_output=True, text=True).stdout
          old = json.loads(old_raw) if old_raw else {}
          print("yes" if new.get("all_results") != old.get("all_results") else "no")
          PY
            )
            if [ "$CHANGED" = "yes" ]; then
              CHANGED_FILES="$CHANGED_FILES $f"
            else
              git checkout -- "$f"
            fi
          done

          if [ -z "$CHANGED_FILES" ]; then
            echo "No market's data actually changed (holidays, or only timestamps moved) — nothing to commit."
            exit 0
          fi

          git add $CHANGED_FILES
          git commit -m "Refresh scan data ($(TZ=America/New_York date '+%Y-%m-%d'))"
          git push
