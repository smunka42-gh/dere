# Forces Streamlit's OWN theme engine to a light base, matching
# theme.py's Minimal Data-First colors.
#
# Why this file exists: Streamlit auto-detects the browser/OS's
# prefers-color-scheme and themes its NATIVE widgets (text inputs,
# sliders, etc.) accordingly when no theme is set here. Real bug hit
# while building the redesign: the ticker search box rendered with a
# black background even though theme.py's CSS explicitly set the page
# to a white/light look — the CSS only overrides specific elements we
# targeted by hand, but Streamlit's own dark-mode auto-detection was
# still driving every OTHER native widget we didn't individually patch.
# Setting [theme] here fixes it at the source for ALL native widgets at
# once, instead of playing whack-a-mole finding each one via CSS.
# Hides Streamlit's auto-generated multipage nav in the sidebar
# (2026-08-27: the Methodology page shouldn't read as a "2nd
# tab"). The page still EXISTS and st.page_link still routes to it —
# this only removes the sidebar listing, which was the last thing
# forcing a sidebar onto what is otherwise a single-page tool. The
# Option 3 mockup had no sidebar at all; its nav lived in the header
# strip, which is where the Methodology link now sits.
[client]
showSidebarNavigation = false
# Hides the "File change. Rerun / Always rerun" prompt Streamlit shows in
# the top-right whenever a source file is edited while the app is running
# (2026-08-27). It's a developer convenience,
# not part of the app — with runOnSave below, edits just reload silently,
# so the prompt has nothing left to ask.
toolbarMode = "minimal"

[server]
# Auto-reload on save instead of prompting. NOTE: this covers app.py and
# other watched modules, but NOT theme.py's CSS in practice — Streamlit
# caches imported modules, so theme changes still need a full restart.
runOnSave = true

[theme]
base = "light"
primaryColor = "#3b6e91"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#fafbfc"
textColor = "#16181d"
font = "sans serif"
